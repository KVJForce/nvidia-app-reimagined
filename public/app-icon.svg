<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#76b900;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#76b900;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="#76b900" stroke-width="6" opacity="0.5" />

  <!-- Center glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glow)" />

  <!-- GPU chip body -->
  <rect x="176" y="176" width="160" height="160" rx="24" ry="24" fill="#3a3a3a" stroke="#555" stroke-width="3" />
  <rect x="176" y="176" width="160" height="32" rx="24" ry="24" fill="#2a2a2a" />

  <!-- Green accent bar -->
  <rect x="188" y="204" width="136" height="10" rx="5" ry="5" fill="#76b900" />
  <rect x="188" y="222" width="100" height="8" rx="4" ry="4" fill="#5d8cff" opacity="0.8" />

  <!-- Circuit nodes -->
  <circle cx="216" cy="260" r="10" fill="#76b900" />
  <circle cx="296" cy="260" r="10" fill="#76b900" />
  <circle cx="216" cy="300" r="8" fill="#5d8cff" opacity="0.8" />
  <circle cx="296" cy="300" r="8" fill="#5d8cff" opacity="0.8" />

  <!-- Circuit traces -->
  <path d="M 226 260 L 260 260 L 260 294" stroke="#76b900" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M 286 260 L 252 260 L 252 294" stroke="#5d8cff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8" />

  <!-- Small dots -->
  <circle cx="200" cy="230" r="5" fill="#76b900" opacity="0.6" />
  <circle cx="312" cy="230" r="5" fill="#76b900" opacity="0.6" />
  <circle cx="200" cy="330" r="5" fill="#5d8cff" opacity="0.6" />
  <circle cx="312" cy="330" r="5" fill="#5d8cff" opacity="0.6" />
</svg>
