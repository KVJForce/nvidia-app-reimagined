  <div class="ambient" aria-hidden="true"></div>

  <div class="app-shell" id="app-shell">
    <button class="sidebar-scrim" type="button" data-action="close-sidebar" aria-label="Close navigation" tabindex="-1"></button>

    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <a class="brand" href="#/home" aria-label="NVIDIA App home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><use href="#i-spark"/></svg>
        </span>
        <span class="brand-type">NVIDIA<span>App</span></span>
      </a>

      <nav class="nav" aria-label="Primary navigation">
        <p class="nav-label">Workspace</p>
        <a class="nav-item is-active" href="#/home" data-nav="home">
          <svg class="nav-icon" aria-hidden="true"><use href="#i-home"/></svg>
          <span class="nav-text">Home</span>
          <span class="nav-pip" aria-hidden="true"></span>
        </a>
        <a class="nav-item" href="#/drivers" data-nav="drivers">
          <svg class="nav-icon" aria-hidden="true"><use href="#i-download"/></svg>
          <span class="nav-text">Drivers</span>
          <span class="nav-badge" id="nav-driver-badge" hidden>1</span>
        </a>
        <a class="nav-item" href="#/games" data-nav="games">
          <svg class="nav-icon" aria-hidden="true"><use href="#i-gamepad"/></svg>
          <span class="nav-text">Games</span>
        </a>
        <a class="nav-item" href="#/performance" data-nav="performance">
          <svg class="nav-icon" aria-hidden="true"><use href="#i-activity"/></svg>
          <span class="nav-text">Performance</span>
          <span class="live-dot" aria-hidden="true"></span>
        </a>
        <a class="nav-item nav-item-settings" href="#/settings" data-nav="settings">
          <svg class="nav-icon" aria-hidden="true"><use href="#i-settings"/></svg>
          <span class="nav-text">Settings</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>

      <section class="sidebar-gpu" id="sidebar-gpu" aria-label="GPU status">
        <div class="skeleton skeleton-line skeleton-line-sm"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line skeleton-line-md"></div>
      </section>

      <button class="profile-chip" type="button" data-route="settings" aria-label="Open profile and settings">
        <span class="avatar avatar-sm" aria-hidden="true">N</span>
        <span class="profile-copy">
          <strong>Local profile</strong>
          <small>Concept build</small>
        </span>
        <svg class="profile-arrow" aria-hidden="true"><use href="#i-chevron-right"/></svg>
      </button>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn mobile-menu" type="button" data-action="toggle-sidebar" aria-label="Open navigation">
          <svg aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
        <div class="topbar-context">
          <span class="context-dot" aria-hidden="true"></span>
          <span id="topbar-page">Home</span>
        </div>
        <div class="topbar-actions">
          <button class="search-trigger" type="button" data-action="open-search" aria-label="Search (Control K)">
            <svg aria-hidden="true"><use href="#i-search"/></svg>
            <span>Search</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn has-indicator" type="button" data-route="drivers" aria-label="Driver updates">
            <svg aria-hidden="true"><use href="#i-bell"/></svg>
            <span class="indicator-dot" id="notification-dot" hidden></span>
          </button>
          <button class="avatar" type="button" data-route="settings" aria-label="Open settings">N</button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1" aria-live="polite">
        <div class="boot-screen" aria-label="Loading">
          <div class="boot-mark"><svg aria-hidden="true"><use href="#i-spark"/></svg></div>
          <div class="boot-copy">
            <span>Waking up your rig</span>
            <div class="boot-bar"><i></i></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="sheet-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script src="/app.js" defer></script>
</body>
</html>
